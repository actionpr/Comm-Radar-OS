name: Dock-In-sight Daily Report
on:
  schedule:
    - cron: '0 23 * * 0-4'
  workflow_dispatch:
jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Dock-In-sight pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.AIPROXY_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.AIPROXY_BASE_URL }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          GAS_REDDIT_URL: ${{ secrets.GAS_REDDIT_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py
      - name: Deploy report to GitHub Pages
        run: |
          cp dock-in-sight-*.html index.html 2>/dev/null || true
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .issue_number seen_articles.json index.html
          git diff --staged --quiet || git commit -m "Dock-In-sight daily update [skip ci]"
          git push
